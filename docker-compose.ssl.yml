services:
  nginx:
    image: nginx:latest
    container_name: ariana-asterisk-ssl
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-366}:366"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - ariana-asterisk-network

