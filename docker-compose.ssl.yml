services:
  nginx:
    image: nginx:latest
    container_name: ariana-asterisk-ssl
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-366}:366"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"
    depends_on:
      - api
    networks:
      - ariana-asterisk-network

